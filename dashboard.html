<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(900px 500px at 0% 0%,var(--bg1),transparent 60%),radial-gradient(800px 500px at 100% 20%,var(--bg2),transparent 60%),var(--bg3);background-attachment:fixed;padding-top:env(safe-area-inset-top,0)}

.wrap{max-width:1280px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0))}
.hd{display:flex;align-items:center;gap:16px}

.sync{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-sizing:border-box}
.sync{color:var(--ink);font-family:inherit}
/* while syncing the dot becomes a spinning ring; red dot = last sync failed */
.sync.busy{cursor:progress}
.sync.busy i{width:13px;height:13px;margin:-2.5px;background:none;border:2px solid var(--green);border-right-color:transparent;animation:spin .7s linear infinite}

.top2{display:flex;align-items:center;gap:28px;margin:22px 0 22px;flex-wrap:wrap}

.kpi{display:flex;align-items:center;gap:12px}

em.g{background:var(--green)}em.r{background:var(--red)}

.cols{display:grid;gap:16px;grid-template-columns:1fr}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--pborder);border-radius:30px;padding:20px;box-shadow:0 6px 28px rgba(30,60,60,.05)}

.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid #b8c0c4;background:var(--card);flex:none;cursor:pointer;color:#fff;font-size:14px;line-height:1}.chk.on{background:var(--green);border-color:var(--green)}
.stk{display:flex;align-items:center;gap:9px}.stk button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}

.btn{background:var(--dark);color:#fff;border:0;border-radius:99px;padding:13px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.btn.sec{background:var(--sec);color:var(--ink)}.btn.del{background:none;color:var(--red)}

<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockh"><section class="panel"><div class="logo"><span class="lm"><svg viewBox="0 0 24 24"><path d="M4 16l5-6 4 4 7-8"/></svg></span>wismir</div><h2 id="lockh">Enter PIN</h2><div class="lbl">Same PIN as Google Sheets in Settings.</div><div class="f"><input id="lockpin" type="password" autocomplete="off" aria-label="PIN"></div><div id="lockerr" class="lbl neg" style="margin:2px 6px 10px"></div><button class="btn" id="lockok">Unlock</button></section></div>
<script>
const $=s=>document.querySelector(s);
const KEY='wismir_v1';
const rp=n=>'Rp\u00a0'+Math.round(n||0).toLocaleString('id-ID');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const SHEET={tx:'Keuangan',products:'Stok',tasks:'Tugas',prod:'Production',mkt:'Marketing',purch:'Purchasing',staff:'Staff',stores:'Store',supp:'Supplier',hist:'Penjualan',rec:'Recurring'};
const POSK={produk:'POS Produk',karyawan:'POS Karyawan',stok:'POS Stok',shift:'POS Shift',absen:'POS Absen'};
let S={tx:[],products:[],tasks:[],prod:[],mkt:[],purch:[],staff:[],stores:[],supp:[],hist:[],rec:[],pos:{},cfg:{url:'',pin:''}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.pos=S.pos||{};
// Dates from Google Sheets can arrive as "2026-11-03T17:00:00.000Z"; turn them back into a local yyyy-mm-dd
const nd=v=>{if(v==null||v==='')return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?s:ymd(d)};
const DKEYS=['tanggal','date','start','end','joined','tempo','paidOn','next'];
const normRow=o=>{DKEYS.forEach(k=>{if(k in o)o[k]=nd(o[k])});return o};
for(const k in SHEET)S[k]=(S[k]||[]).map(normRow);
S.tx.forEach(t=>{t.jenis=t.jenis==='Masuk'?'Income':t.jenis==='Keluar'?'Expense':t.jenis});
let fv='tx',SY='',SSt='all',EY='',ECat='all',OM='',FM='',pop=null,tf='all',tab='home',ops='stock',pt='purch',txf='Income',status='',stv='list';
// stock history filters
const HF={per:'30d',from:'',to:'',loc:'all',cat:'all',brand:'all',type:'all',q:'',n:200};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
tx:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>',
prod:'<path d="M3 21V10l6 4v-4l6 4V6h6v15z"/>',
mkt:'<path d="M3 11v2a1 1 0 0 0 1 1h2l8 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M18 9a4 4 0 0 1 0 6"/>',
ops:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
task:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
late:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
nod:'<path d="M4 7h16M4 12h16M4 17h10"/>',
set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// cfg.dirty counts local changes not yet confirmed by Sheets; cfg.pulled = Sheets was loaded at least once
function save(push=true){
  if(push&&S.cfg.url)S.cfg.dirty=(S.cfg.dirty||0)+1;
  persist();
  if(push&&S.cfg.url){clearTimeout(save.t);save.t=setTimeout(pushSheets,1200)}
  render();
}
const dashData=()=>{const d={};for(const k in SHEET)d[SHEET[k]]=S[k];return d};
const hhmm=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
// S.base = copy of the Sheet as this device last saw it; local edits = differences from it
const snap=()=>JSON.parse(JSON.stringify(dashData()));
// Code.gs version this dashboard expects (must match CODE_VERSION in Code.gs)
const NEED_CODE=9;
// An older Code.gs leaves out columns it does not know yet: keep this device's values for those keys
// instead of wiping them, so a new field survives until Code.gs is updated (then they reach the Sheet).
let kmN=0; // values kept this way: they still have to reach the Sheet
function keepMissing(rows,old){const m={};(old||[]).forEach(o=>m[o.id]=o);return rows.map(r=>{const o=m[r.id];if(!o)return r;const x={...r};for(const k in o)if(!(k in r)){x[k]=o[k];if(o[k]!==''&&o[k]!=null)kmN++}return x})}
function setBase(ver){S.cfg.ver=ver==null?S.cfg.ver:String(ver);S.base=snap()}
// Apply this device's edits (added / changed / deleted rows, by id) on top of fresh Sheet data
// A tab the Sheet only just got (Code.gs updated late) arrives empty: keep this device's rows and send them
const newTab=(n,d)=>!(S.cfg.tabs||['Keuangan','Stok','Tugas','Production','Marketing','Purchasing','Staff','Store']).includes(n)&&!d.length&&(S[Object.keys(SHEET).find(k=>SHEET[k]===n)]||[]).length;
function mergeInto(server){
  const base=S.base||{};
  for(const k in SHEET){
    const n=SHEET[k],srv=keepMissing((server[n]||[]).map(normRow),S[k]);
    if(!server[n]||newTab(n,server[n]))continue;
    const b={};(base[n]||[]).forEach(x=>b[x.id]=JSON.stringify(x));
    const mine={};S[k].forEach(x=>mine[x.id]=x);
    const gone=new Set(Object.keys(b).filter(id=>!mine[id]));
    const out=srv.filter(x=>!gone.has(String(x.id)));
    const at={};out.forEach((x,i)=>at[x.id]=i);
    S[k].forEach(x=>{if(b[x.id]===JSON.stringify(x))return;if(at[x.id]!=null)out[at[x.id]]=x;else out.push(x)});
    S[k]=out;
  }
}
let syncN=0,syncT0=0,syncOk=true;
function syncUi(on){
  if(on){if(!syncN++)syncT0=Date.now()}else syncN=Math.max(0,syncN-1);
  const b=$('#sync');if(!b)return;
  const show=busy=>{b.classList.toggle('busy',busy);b.classList.toggle('bad',!busy&&!syncOk);b.setAttribute('aria-busy',String(busy));$('#syncLbl').textContent=busy?'Syncing…':'Sync';b.title=busy?'Syncing with Google Sheets':(syncOk?'Sync with Google Sheets':'Last sync failed: '+status)};
  if(syncN){show(true);return}
  setTimeout(()=>{if(!syncN)show(false)},Math.max(0,600-(Date.now()-syncT0)));
}
const tracked=f=>async function(...a){syncUi(true);try{return await f.apply(this,a)}finally{syncUi(false)}};
const pushSheets=tracked(_pushSheets),pullSheets=tracked(_pullSheets);
async function _pushSheets(tries=0){
  if(!S.cfg.url)return setStatus('Add your Google Sheets URL in Settings first.');
  // Never overwrite Sheets from a device that has not loaded it yet (e.g. a new computer)
  if(!S.cfg.pulled)return pullSheets();
  clearTimeout(save.t);
  setStatus('Sending to Google Sheets…');
  const d0=S.cfg.dirty,sent=snap();
  try{
    const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin:S.cfg.pin,data:sent,base:S.cfg.ver})});
    const j=await r.json();
    if(j.ok){if(j.ver)S.cfg.ver=String(j.ver);S.base=sent;if(S.cfg.dirty===d0)S.cfg.dirty=0;persist();setStatus('Synced '+hhmm());if(S.cfg.dirty)save.t=setTimeout(pushSheets,1200)}
    else if(j.conflict&&tries<3){
      // Another device saved in the meantime: load its data, keep both sets of changes, send again
      setStatus('Merging changes from another device…');
      const g=await (await fetch(S.cfg.url+'?pin='+encodeURIComponent(S.cfg.pin))).json();
      if(!g.ok)return setStatus('Failed: '+(g.error||'wrong PIN'));
      mergeInto(g.data);S.cfg.ver=String(g.ver);S.base=JSON.parse(JSON.stringify(g.data));
      for(const k in POSK){const d=g.data[POSK[k]];if(d)S.pos[k]=d}
      persist();render();return pushSheets(tries+1);
    }
    else setStatus('Failed: '+(j.error||'wrong PIN'));
  }catch(e){setStatus('Could not connect. Your data is safe on this device and will be sent next time.')}
}
async function _pullSheets(){
  if(!S.cfg.url)return setStatus('Add your Google Sheets URL in Settings first.');
  // Unsent changes on this device go up first, so loading never overwrites them
  if(S.cfg.pulled&&S.cfg.dirty){
    await pushSheets();
    if(S.cfg.dirty)return setStatus('Your latest changes are not sent yet, so data was not reloaded. They are safe on this device.');
  }
  setStatus('Loading from Google Sheets…');
  try{
    const r=await fetch(S.cfg.url+'?pin='+encodeURIComponent(S.cfg.pin));
    const j=await r.json();
    if(!j.ok)return setStatus('Failed: '+(j.error||'wrong PIN'));
    kmN=0;
    const busy=S.cfg.pulled&&S.cfg.dirty; // edited while loading: keep local, send it instead
    let kept=0;
    if(!busy){
      for(const k in SHEET){const d=j.data[SHEET[k]];if(d&&newTab(SHEET[k],d)){kept++;continue}if(d)S[k]=keepMissing(d.map(normRow),S[k])}
      S.cfg.tabs=Object.keys(j.data);if(kept)kmN++;
      S.tx.forEach(t=>{t.jenis=t.jenis==='Masuk'?'Income':t.jenis==='Keluar'?'Expense':t.jenis});
      S.cfg.pulled=1;S.cfg.dirty=0;setBase(j.ver);
    }
    for(const k in POSK){const d=j.data[POSK[k]];if(d)S.pos[k]=d}
    S.cfg.codeOld=(+j.v||0)<NEED_CODE;
    // device-only values (older Code.gs): mark as unsent, so they go up before the next load and land once Code.gs is updated
    if(!busy&&(S.cfg.codeOld||kept)&&kmN)S.cfg.dirty=(S.cfg.dirty||0)+1;
    save(false);setStatus('Data loaded from Sheets '+hhmm());
    if(!busy)runRecurring();
    if(!busy&&migratePos())save(); // sends the merged lists back to Sheets
    if(busy||kept)pushSheets(); // kept: rows of a tab the Sheet only just got go up now
  }catch(e){setStatus('Could not connect to Google Sheets.')}
}
// Closing the tab right after an edit: try one last send (next open sends again if needed)
function flushOnLeave(){if(S.cfg.url&&S.cfg.pulled&&S.cfg.dirty&&typeof navigator!=='undefined'&&navigator.sendBeacon){try{navigator.sendBeacon(S.cfg.url,new Blob([JSON.stringify({pin:S.cfg.pin,data:dashData(),base:S.cfg.ver})],{type:'text/plain'}))}catch(e){}}}
addEventListener('pagehide',flushOnLeave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnLeave();else refresh()});
// Coming back to an open tab (or every 5 minutes): reload so this device never edits stale data
function refresh(){const ae=document.activeElement;if(locked||!S.cfg.url||!S.cfg.pulled||$('#bg').classList.contains('open')||(ae&&ae.tagName==='INPUT'))return;if(Date.now()-(refresh.t||0)<20000)return;refresh.t=Date.now();pullSheets()}
setInterval(()=>{if(document.visibilityState!=='hidden')refresh()},300000);
function setStatus(t){status=t;const e=$('#st');if(e)e.textContent=t;
  // anything that is not progress or success counts as a failed sync (red dot on the Sync button)
  if(!/…$/.test(t))syncOk=!/^(Failed|Could not|Your latest changes are not sent|Add your Google Sheets URL)/.test(t)}

const TABS=[['home','Overview'],['task','Reminders'],['tx','Finance'],['prod','Production'],['mkt','Marketing'],['ops','Operational'],['set','Settings']];
const P=k=>(S.pos&&S.pos[k])||[];
const PEXT=['Supplier','Konveksi','Sale','Rusak/Hilang','Koreksi opname'];
// Stock locations: warehouses + physical stores from Operational > Store (same list the POS uses), then any older names still in POS history
function posLocs(){const nm=t=>S.stores.filter(x=>x.type===t).map(x=>String(x.name||'').trim()).filter(Boolean);const l=[...nm('Warehouse'),...nm('Physical store')];P('stok').forEach(x=>[x.dari,x.ke].forEach(v=>{v=String(v||'');if(v&&!PEXT.includes(v)&&!l.includes(v))l.push(v)}));return l.length?l:['Gudang','Toko A','Toko B']}
function posStock(){const m={},L=posLocs();P('stok').forEach(x=>{if(x.status==='void')return;const q=+x.qty||0,o=m[x.pid]||(m[x.pid]={});if(L.includes(x.ke))o[x.ke]=(o[x.ke]||0)+q;if(L.includes(x.dari))o[x.dari]=(o[x.dari]||0)-q});return m}
const posTotal=(m,id)=>Object.values(m[id]||{}).reduce((a,b)=>a+b,0);
// ---------- stock history (moves recorded on the store tablets) ----------
const MVT={sale:'Sale',in:'Stock in',out:'Stock out',tf:'Transfer',loss:'Damaged / lost',opname:'Stock count'};
function mvKind(x){const f=String(x.dari||''),t=String(x.ke||'');return x.jenis==='sale'||t==='Sale'||f==='Sale'?'sale':t==='Rusak/Hilang'?'loss':(f==='Koreksi opname'||t==='Koreksi opname')?'opname':['Supplier','Konveksi'].includes(f)?'in':['Supplier','Konveksi'].includes(t)?'out':'tf'}
const LOCNAME={'Sale':'Sold','Rusak/Hilang':'Damaged / lost','Koreksi opname':'Stock count'};
const locName=v=>LOCNAME[v]||v;
function perRange(){const T=today(),d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)},m0=T.slice(0,7)+'-01';
  const lm=(()=>{const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-1);return ymd(x)})();
  return {today:[T,T],'7d':[d(6),T],'30d':[d(29),T],month:[m0,T],last:[lm,(()=>{const x=new Date(m0+'T00:00');x.setDate(0);return ymd(x)})()],all:['',''],custom:[HF.from,HF.to]}[HF.per]||['','']}
function histRows(){
  const [a,b]=perRange(),pm={};S.products.forEach(p=>pm[p.id]=p);
  const q=HF.q.trim().toLowerCase();
  return P('stok').filter(x=>{
    const d=nd(x.tanggal),p=pm[x.pid]||{};
    if(a&&d<a||b&&d>b)return false;
    if(HF.loc!=='all'&&x.dari!==HF.loc&&x.ke!==HF.loc)return false;
    if(HF.cat!=='all'&&String(p.kategori||'')!==HF.cat)return false;
    if(HF.brand!=='all'&&String(p.brand||'')!==HF.brand)return false;
    if(HF.type!=='all'&&mvKind(x)!==HF.type)return false;
    if(q&&!(String(x.produk||p.nama||'')+' '+String(p.sku||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((x,y)=>(+y.t||0)-(+x.t||0)||String(y.tanggal).localeCompare(String(x.tanggal)));
}
function hList(){
  const r=histRows(),live=r.filter(x=>x.status!=='void'),pm={};S.products.forEach(p=>pm[p.id]=p);
  // in/out from the point of view of the chosen location (or of the business as a whole)
  const sign=x=>HF.loc!=='all'?(x.ke===HF.loc?1:-1):(['in'].includes(mvKind(x))||(mvKind(x)==='opname'&&x.dari==='Koreksi opname')?1:['tf'].includes(mvKind(x))?0:-1);
  let pin=0,pout=0;live.forEach(x=>{const v=+x.qty||0,sg=sign(x);if(sg>0)pin+=v;else if(sg<0)pout+=v});
  let last='',html='';
  r.slice(0,HF.n).forEach(x=>{const d=nd(x.tanggal);if(d!==last){last=d;html+=`<div class="sub" style="margin:14px 2px 6px">${d===today()?'Today':fmtD(d)}</div>`}
    const p=pm[x.pid]||{},k=mvKind(x),sg=sign(x),v=x.status==='void';
    html+=`<div class="row${v?' fut':''}" style="cursor:default"><div class="grow"><div class="t">${esc(x.produk||p.nama||'(deleted product)')}${p.sku?' <span class="lbl">· '+esc(p.sku)+'</span>':''}</div><div class="lbl">${esc(x.jam||'')} · ${esc(locName(x.dari))} → ${esc(locName(x.ke))}${x.oleh?' · '+esc(x.oleh):''}${x.catatan?' · '+esc(x.catatan):''}${v?' · cancelled':''}</div></div><div style="text-align:right"><span class="pill${k==='sale'||k==='loss'||k==='out'?' warn':''}">${MVT[k]}</span><div><b class="${v?'':sg>0?'pos':sg<0?'neg':''}" style="${v?'text-decoration:line-through':''}">${sg>0?'+':sg<0?'−':''}${+x.qty||0}</b></div></div></div>`});
  return `<div class="lbl" style="margin:0 4px 6px">${live.length} move${live.length===1?'':'s'} · in ${pin} pcs · out ${pout} pcs${HF.loc==='all'?' (transfers between locations not counted)':''}</div><div class="card">${html||empty(P('stok').length?'No stock moves match these filters.':(S.cfg.url?'No stock history yet. Moves recorded on the store tablet (POS) appear here.':'Connect Google Sheets in Settings to see stock history from the store tablet (POS).'))}</div>`+
    (r.length>HF.n?`<button class="btn sec" onclick="HF.n+=200;updH()">Show more (${r.length-HF.n} left)</button>`:'')+
    `<div class="lbl" style="padding:8px 6px 0">Sales of a shift that is still open appear when the shift is closed.</div>`;
}
function updH(){const e=$('#hlist');if(e)e.innerHTML=hList()}
function setHF(k,v){HF[k]=v;HF.n=200;if(k==='per'){const c=$('#hcustom');if(c)c.style.display=v==='custom'?'':'none'}updH()}
function vHist(){
  const sel=(k,label,opts)=>`<div class="f"><label>${label}</label><select onchange="setHF('${k}',this.value)">${opts.map(o=>`<option value="${esc(o[0])}"${HF[k]===o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  const vals=k=>usedVals(k).map(v=>[v,v]);
  return `<div class="hfil">`+
    sel('per','Period',[['today','Today'],['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['last','Last month'],['all','All time'],['custom','Custom dates']])+
    sel('loc','Store / warehouse',[['all','All locations'],...posLocs().map(l=>[l,l])])+
    sel('type','Type',[['all','All types'],...Object.entries(MVT)])+
    sel('cat','Category',[['all','All categories'],...vals('kategori')])+
    sel('brand','Brand',[['all','All brands'],...vals('brand')])+
    `<div class="f"><label>Product or SKU</label><input type="search" value="${esc(HF.q)}" placeholder="Search…" oninput="setHF('q',this.value)"></div>`+
    `</div><div class="hfil" id="hcustom" style="${HF.per==='custom'?'':'display:none'}"><div class="f"><label>From</label><input type="date" value="${esc(HF.from)}" onchange="setHF('from',this.value)"></div><div class="f"><label>To</label><input type="date" value="${esc(HF.to)}" onchange="setHF('to',this.value)"></div></div>`+
    `<div id="hlist">${hList()}</div>`;
}
// One product list for Dashboard and POS: store/warehouse stock comes from POS moves, online stock is typed here
const isOff=x=>x.aktif==='Inactive';
const prodTotal=(p,m)=>posTotal(m,p.id);
const pname=p=>String(p.nama||'')+(p.varian?' · '+p.varian:'');
// Products and staff made on a store tablet before they moved to the dashboard: copy them in once (same id, so history stays linked)
function migratePos(){
  let n=0;const st=v=>/^(0|inactive|nonaktif)$/i.test(String(v??'').trim())?'Inactive':'Active';
  P('produk').forEach(r=>{const id=String(r.id||'');if(!id||S.products.some(p=>p.id===id))return;S.products.push({id,nama:String(r.nama||''),varian:'',stokOnline:0,min:3,harga:'',kategori:String(r.kategori||''),aktif:st(r.aktif)});n++});
  P('karyawan').forEach(r=>{const id=String(r.id||'');if(!id||S.staff.some(p=>p.id===id))return;S.staff.push({id,joined:'',name:String(r.nama||''),aktif:st(r.aktif)});n++});
  return n;
}
// Each closed store shift counts as one Income entry (read-only) in Finance
const posTx=()=>P('shift').filter(s=>+s.totalPenjualan).map(s=>({id:'pos:'+s.id,pos:1,jenis:'Income',tanggal:nd(s.tanggal),kategori:'Sales',channel:'Store',jumlah:+s.totalPenjualan,catatan:'POS · '+s.toko+' · '+(s.buka||'')+'–'+(s.tutup||'')}));
const allTx=()=>S.tx.concat(posTx());
const openTasks=()=>S.tasks.filter(t=>!t.selesai);
const dueTasks=()=>openTasks().filter(t=>!t.tempo||t.tempo<=today());
const minOf=p=>p.min===''||p.min==null||isNaN(+p.min)?3:+p.min;

const icons=()=>TABS.map(t=>`<button data-t="${t[0]}" title="${t[1]}" aria-label="${t[1]}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg></button>`).join('')+`<button data-t="theme" title="Light / dark mode" aria-label="Toggle light or dark mode"><svg viewBox="0 0 24 24"></svg></button>`;

const SCOL={m:/^(date|tanggal|tgl|bulan|month|periode|period)$/,st:/^(store|toko|channel|outlet|lokasi)$/,sku:/^(sku|kode|code|kode produk|item code|produk|product)$/,q:/^(sold|qty|terjual|pcs|jumlah|quantity|qty sold)$/,v:/^(total pendapatan|pendapatan|revenue|total|omzet|omset|sales|penjualan|nilai)$/};
function sMonth(v){v=String(v||'').trim();let x;
  if(x=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))return x[3]+'-'+x[2].padStart(2,'0');
  if(x=v.match(/^(\d{4})-(\d{1,2})(-\d{1,2})?/))return x[1]+'-'+x[2].padStart(2,'0');
  if(x=v.match(/^(\d{1,2})[\/.-](\d{4})$/))return x[2]+'-'+x[1].padStart(2,'0');return ''}
function salesParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return{rows:[],bad:0};
  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const cells=lines.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
  const head=cells[0].map(h=>h.toLowerCase().replace(/\s+/g,' ').trim()),map={};
  head.forEach((h,i)=>{for(const k in SCOL)if(map[k]==null&&SCOL[k].test(h))map[k]=i});
  const hasHead=map.m!=null&&map.sku!=null;const M=hasHead?map:{m:0,st:1,sku:2,q:3,v:4};
  const agg={};let bad=0;
  (hasHead?cells.slice(1):cells).forEach(c=>{const m=sMonth(c[M.m]),sku=String(c[M.sku]||'').trim(),st=String(c[M.st]||'').trim()||'Store';
    if(!m||!sku){bad++;return}const k=m+'|'+st+'|'+sku.toLowerCase(),o=agg[k]||(agg[k]={bulan:m,toko:st,sku,qty:0,total:0});o.qty+=+impNum(c[M.q])||0;o.total+=+impNum(c[M.v])||0});
  return{rows:Object.values(agg),bad};
}

const ECOL={d:/^(tanggal|tgl|date|day)$/,c:/^(kategori|category|jenis|type)$/,v:/^(jumlah|amount|nominal|total|biaya|expense|pengeluaran)$/,n:/^(catatan|note|notes|keterangan|ket|description|deskripsi)$/};

  const hasHead=map.d!=null&&map.v!=null,M=hasHead?map:{d:0,c:1,v:2,n:3},seen={},rows=[];let bad=0;
  (hasHead?cells.slice(1):cells).forEach(c=>{const d=eDate(c[M.d]),v=+impNum(c[M.v])||0;if(!d||!v){bad++;return}
    const r={tanggal:d,kategori:ecap(c[M.c]),jumlah:v,catatan:String(c[M.n]||'').trim()},k=[r.tanggal,r.kategori.toLowerCase(),r.jumlah,r.catatan].join('|');seen[k]=(seen[k]||0)+1;

}

function impParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());

  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const cells=lines.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
  const head=cells[0].map(h=>h.toLowerCase().replace(/\s+/g,' ').trim()),map={};
  head.forEach((h,i)=>{for(const k in IMPCOL)if(map[k]==null&&IMPCOL[k].test(h))map[k]=i});

  if(map.nama==null){IMPORDER.forEach((k,i)=>map[k]=i);body=cells} // no header row: Product, Category, Brand, SKU, COGS

  const rows=body.map(c=>{const g=k=>map[k]==null?'':String(c[map[k]]||'').trim();

}

  <div id="err" class="lbl neg" style="margin:2px 6px 8px"></div><button class="btn" id="impgo" disabled style="opacity:.5">Nothing to import yet</button><button class="btn sec" id="no" style="margin-top:8px">Cancel</button>`;
  $('#imptext').oninput=impPreview;$('#no').onclick=close;
  $('#impgo').onclick=()=>{const nw=impParse($('#imptext').value).rows.filter(r=>r.st==='new');if(!nw.length)return;
    nw.forEach(r=>S.products.push({id:uid(),nama:r.nama,kategori:r.kategori,brand:r.brand,sku:r.sku,cogs:r.cogs,min:3,aktif:'Active'}));
    close();tab='ops';ops='stock';stv='list';save();
    setStatus('Imported '+nw.length+' products');};
  $('#bg').classList.add('open');setTimeout(()=>$('#imptext').focus(),50);
}
function addProduct(){form('New product',pFields(),v=>{if(skuTaken(v))return err('This SKU is already used by another product.'),false;S.products.push({id:uid(),min:3,...cleanP(v)});save()})}
// The bottom button: Delete for a product without store history; otherwise hide it from the POS cashier (history keeps its name), or show it again
function editProduct(id){const p=S.products.find(x=>x.id===id),hist=P('stok').some(x=>String(x.pid)===id)||P('produk').some(x=>String(x.id)===id);
  const del=isOff(p)?()=>{p.aktif='Active';save()}:hist?()=>{p.aktif='Inactive';save()}:()=>{S.products=S.products.filter(x=>x.id!==id);save()};
  form('Edit product',pFields(p),v=>{if(skuTaken(v,id))return err('This SKU is already used by another product.'),false;Object.assign(p,cleanP(v));save()},del,isOff(p)?'Show in cashier again':hist?'Hide from cashier':'')}
const DIVS=['Finance','Production','Marketing','Operational'],DICON={Finance:'tx',Production:'prod',Marketing:'mkt',Operational:'ops'};
const REPS=['None','Daily','Weekly','Monthly','Custom'];
const repLbl=t=>t.repeat==='Custom'?'Every '+(t.every||1)+' '+(t.unit||'days'):t.repeat;
const rk=t=>!t.tempo?2:t.tempo<today()?0:t.tempo===today()?1:3;
function nextDate(d,r,t={}){const x=new Date(d+'T00:00'),n=Math.max(1,+t.every||1);if(r==='Daily')x.setDate(x.getDate()+1);else if(r==='Weekly')x.setDate(x.getDate()+7);else if(r==='Custom'){if(t.unit==='months')x.setMonth(x.getMonth()+n);else x.setDate(x.getDate()+n*(t.unit==='weeks'?7:1))}else x.setMonth(x.getMonth()+1);return ymd(x)}
function tog(id){
  const t=S.tasks.find(x=>x.id===id);
  if(t.repeat&&t.repeat!=='None'){let d=nextDate(t.tempo||today(),t.repeat,t);while(d<=today())d=nextDate(d,t.repeat,t);t.tempo=d}
  else S.tasks=S.tasks.filter(x=>x.id!==id);
  save();
}
// Reminder links (owner 2026-11-10): a website or a page of this dashboard; the reminder row gets a link button
const PAGES={'Overview':{tab:'home'},'Reminders':{tab:'task'},'Finance › Income':{tab:'tx',fv:'tx',txf:'Income'},'Finance › Expense':{tab:'tx',fv:'tx',txf:'Expense'},'Finance › Report':{tab:'tx',fv:'report'},'Finance › Financial':{tab:'tx',fv:'fin'},
 'Production › Purchasing':{tab:'prod',pt:'purch'},'Production › Manufacturing':{tab:'prod',pt:'manu'},'Production › Supplier':{tab:'prod',pt:'supp'},'Marketing':{tab:'mkt'},
 'Operational › Stock':{tab:'ops',ops:'stock',stv:'list'},'Operational › Stock history':{tab:'ops',ops:'stock',stv:'hist'},'Operational › Staff':{tab:'ops',ops:'staff'},'Operational › Attendance':{tab:'ops',ops:'att'},'Operational › Store':{tab:'ops',ops:'store'},'Operational › Expense':{tab:'ops',ops:'exp'},'Settings':{tab:'set'}};
const pageOf=l=>{l=String(l||'').trim().toLowerCase();if(l==='finance › sales'||l==='finance')l='finance › income';const k=Object.keys(PAGES).find(x=>x.toLowerCase()===l);return k?PAGES[k]:null};
// only http(s) websites; "shopee.co.id" becomes https://shopee.co.id
const webOf=l=>{l=String(l||'').trim();if(!l||/\s/.test(l))return '';if(/^https?:\/\//i.test(l))return l;if(/^[a-z][a-z0-9+.-]*:/i.test(l))return '';return /\./.test(l)?'https://'+l:''};
function openLink(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const pg=pageOf(t.link);
 if(pg){closePop();close();tab=pg.tab;if(pg.fv)fv=pg.fv;if(pg.txf)txf=pg.txf;if(pg.pt)pt=pg.pt;if(pg.ops)ops=pg.ops;if(pg.stv)stv=pg.stv;render();scrollTo(0,0);return}
 const u=webOf(t.link);if(u)window.open(u,'_blank','noopener')}
const LINKIC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
const tFields=(t={})=>[
  {k:'judul',label:'Reminder',type:'text',val:t.judul||''},
  {k:'div',label:'Division',type:'select',opts:DIVS,val:t.div||'Operational'},
  {k:'tempo',label:'Date',type:'date',val:t.tempo||''},
  {k:'link',label:'Link (optional)',type:'text',val:t.link||'',ph:'A website, e.g. seller.shopee.co.id, or a page below',list:Object.keys(PAGES)},
  {k:'repeat',label:'Repeat',type:'select',opts:REPS,val:t.repeat||'None'},
  {k:'every',label:'Repeat every',type:'number',val:t.every||1,showIf:'repeat=Custom'},
  {k:'unit',label:'Unit',type:'select',opts:['days','weeks','months'],val:t.unit||'days',showIf:'repeat=Custom'}];
const fixT=v=>{v.link=String(v.link||'').trim();if(v.repeat!=='None'&&!v.tempo)v.tempo=today();if(v.repeat==='Custom')v.every=Math.max(1,+v.every||1);return v};
const badLink=v=>{const l=String(v.link||'').trim();return l&&!pageOf(l)&&!webOf(l)};
const LINKERR='Enter a website (for example seller.shopee.co.id) or choose a page from the list.';
function addTask(d){form('New reminder',tFields({div:typeof d==='string'?d:'Operational'}),v=>{if(badLink(v))return err(LINKERR),false;S.tasks.push({id:uid(),selesai:'',...fixT(v)});rd=v.div;save()})}
function editTask(id){const t=S.tasks.find(x=>x.id===id);form('Edit reminder',tFields(t),v=>{if(badLink(v))return err(LINKERR),false;Object.assign(t,fixT(v));save()},()=>{S.tasks=S.tasks.filter(x=>x.id!==id);save()})}
function taskRow(t,showDiv=true){
  const late=t.tempo&&t.tempo<today(),fut=t.tempo&&t.tempo>today();
  return `<div class="row${fut?' fut':''}"><button class="chk" onclick="tog('${t.id}')" aria-label="Mark done"></button><div class="grow" onclick="editTask('${t.id}')"><div class="t">${esc(t.judul)}</div><div class="lbl${late?' neg':''}">${showDiv?esc(t.div||'Operational')+' · ':''}${t.tempo?(t.tempo===today()?'Today':fmtD(t.tempo)):'No date'}${t.repeat&&t.repeat!=='None'?' · ↻ '+repLbl(t):''}</div></div>${pageOf(t.link)||webOf(t.link)?`<button class="lnk" data-link="${t.id}" onclick="event.stopPropagation();openLink('${t.id}')" title="${esc(pageOf(t.link)?'Open '+t.link:webOf(t.link))}" aria-label="Open link">${LINKIC}</button>`:''}</div>`;
}
let rd=null;
const curDiv=()=>rd||DIVS.find(d=>openTasks().some(t=>(t.div||'Operational')===d))||'Finance';
function vTask(){
  const l=openTasks().sort((a,b)=>(rk(a)-rk(b))||(a.tempo||'').localeCompare(b.tempo||'')),cur=curDiv();
  const by=d=>l.filter(t=>(t.div||'Operational')===d);
  return `<h1>Reminders</h1><div class="seg dvt">${DIVS.map(d=>`<button class="${d===cur?'on':''}" title="${d}" aria-label="${d}" onclick="rd='${d}';render()"><svg viewBox="0 0 24 24">${IC[DICON[d]]}</svg>${by(d).length?`<span class="bd2">${by(d).length}</span>`:''}</button>`).join('')}</div><div class="board">${DIVS.map(d=>{const x=by(d);return `<div class="bcol${d===cur?' show':''}"><div class="bh"><div class="sub">${d} · ${x.length}</div><button class="addd" onclick="addTask('${d}')" aria-label="Add reminder to ${d}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="card">${x.length?x.map(t=>taskRow(t,false)).join(''):'<div class="lbl" style="padding:14px 0;text-align:center">No reminders</div>'}</div></div>`}).join('')}</div>`;
}
let sx=null;
$('#app').addEventListener('touchstart',e=>{sx=(tab==='task'||tab==='prod')&&e.target.closest('.board')?e.touches[0].clientX:null},{passive:true});
$('#app').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60&&window.innerWidth<700){if(tab==='prod'){const o=['purch','manu','supp'],i=o.indexOf(pt)+(dx<0?1:-1);if(i>=0&&i<o.length){pt=o[i];render()}}else{const i=DIVS.indexOf(curDiv())+(dx<0?1:-1);if(i>=0&&i<DIVS.length){rd=DIVS[i];render()}}}},{passive:true});
function vSet(){
  return `<h1>Settings</h1><div class="card"><div class="f"><label>Google Apps Script Web App URL</label><input id="cu" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="f"><label>Access PIN</label><input id="cp" type="password" value="${esc(S.cfg.pin)}"></div><div class="lbl" style="margin:-4px 6px 10px">This PIN also unlocks the dashboard on this device.</div>
  <button class="btn" onclick="saveCfg()">Save settings</button></div>
  <div class="card"><button class="btn sec" onclick="pushSheets()">Send data to Sheets</button><button class="btn sec" onclick="pullSheets()">Load data from Sheets</button><div id="st">${esc(status)}</div></div>
  <div class="card"><button class="btn sec" onclick="backup()">Download backup (JSON)</button></div>
  <div class="lbl" style="padding:0 6px">Changes sync to Sheets automatically once the URL and PIN are set. Store data (sales, stock, attendance) comes from the store tablet (POS) through the same Sheet.</div>`;
}
function saveCfg(){const u=$('#cu').value.trim(),p=$('#cp').value;if(u!==S.cfg.url||p!==S.cfg.pin){S.cfg.pulled=0;S.cfg.dirty=0}S.cfg.url=u;S.cfg.pin=p;markUnlocked();save(false);setStatus('Settings saved');if(u)pullSheets()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='wismir-backup-'+today()+'.json';a.click()}

function showKpi(k){
  const T=today(),f={late:t=>t.tempo&&t.tempo<T,today:t=>t.tempo===T,nod:t=>!t.tempo}[k];
  const title={late:'Overdue reminders',today:'Reminders today',nod:'Reminders without date'}[k];
  const l=openTasks().filter(f).sort((a,b)=>((a.tempo||'')+(a.jam||'')).localeCompare((b.tempo||'')+(b.jam||'')));
  const pp=$('#pp'),el=document.querySelector('#kpis [data-k="'+k+'"]');
  pp.innerHTML=`<h3>${title}</h3><div class="card">${l.length?l.map(t=>taskRow(t)).join(''):empty('Nothing here. All clear!')}</div>`;
  if(!el)return;
  const w=Math.min(360,window.innerWidth-24),r=el.getBoundingClientRect();
  pp.style.width=w+'px';
  pp.style.top=(r.bottom+window.scrollY+10)+'px';
  pp.style.left=Math.max(12,Math.min(r.left,window.innerWidth-w-12))+'px';
  pp.classList.add('open');pop=k;
}
function closePop(){pop=null;$('#pp').classList.remove('open')}
$('#kpis').onclick=e=>{const d=e.target.closest('[data-k]');if(d)pop===d.dataset.k?closePop():showKpi(d.dataset.k)};
addEventListener('click',e=>{if(pop&&!e.composedPath().some(n=>n.id==='pp'||n.id==='kpis'))closePop()});
addEventListener('resize',()=>{if(pop)closePop()});
function form(title,fields,onSave,onDel,delLabel){
  closePop();
  $('#sheet').innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<div class="f"${f.showIf?` data-showif="${f.showIf}" style="display:none"`:''}><label>${f.label}</label>${f.type==='checks'?chkHtml(f):f.type==='combo'?cmbHtml(f):f.type==='calc'?`<input id="calc" readonly value="${esc(f.val)}">`:f.type==='select'?`<select data-k="${f.k}">${f.opts.map(o=>`<option ${o===f.val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.type}" value="${esc(f.val)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'inputmode="decimal"':''}${f.list?` list="dl-${f.k}" autocomplete="off"`:''}>${f.list?`<datalist id="dl-${f.k}">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`}</div>`).join('')+
  `<div id="err" class="lbl neg" style="margin:2px 6px 8px"></div><button class="btn" id="ok">Save</button>${onDel?`<button class="btn del" id="rm">${delLabel||'Delete'}</button>`:''}<button class="btn sec" id="no" style="margin-top:8px">Cancel</button>`;
  const sync=()=>$('#sheet').querySelectorAll('[data-showif]').forEach(w=>{const [k,v]=w.dataset.showif.split('=');const e=$('#sheet [data-k="'+k+'"]');w.style.display=e&&e.value===v?'':'none'});
  sync();$('#sheet').querySelectorAll('.ckl .ckb input').forEach((x,i)=>{if(!i)ckCount(x)});
  $('#sheet').oninput=()=>{sync();const g=k=>+(($('#sheet [data-k="'+k+'"]')||{}).value)||0;if($('#calc'))$('#calc').value=rp(g('qty')*g('unitCost'))};
  $('#bg').classList.add('open');
  $('#ok').onclick=()=>{const v={};$('#sheet').querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.dataset.checks!=null?chkVal(e):e.value);
    if((v.jumlah!==undefined&&!+v.jumlah)||(v.total!==undefined&&!+v.total)||(v.qty!==undefined&&!+v.qty&&!fields.find(f=>f.k==='qty').opt))return err('Please enter an amount or quantity.');
    if([v.nama,v.judul,v.name].some(x=>x!==undefined&&!x.trim()))return err('Please enter a name.');
    if(onSave(v)===false)return;close()};
  $('#no').onclick=close;
  if(onDel){let armed=false;$('#rm').onclick=()=>{if(!armed){armed=true;$('#rm').textContent='Tap again to confirm'+(delLabel?'':' delete');return}if(onDel()!==false)close()}}
}
const err=m=>{$('#err').textContent=m};
// combo field (owner 2026-11-10): type to search the list or to write a new value; tap a list item to pick it
function cmbHtml(f){return `<div class="cmb"><input data-k="${f.k}" value="${esc(f.val)}" placeholder="Search or type a new one" autocomplete="off" oninput="cmbF(this)"><div class="cmbl">${f.opts.map(o=>`<button type="button" class="cmbo${String(o).toLowerCase()===String(f.val).toLowerCase()?' on':''}" data-v="${esc(o)}" onclick="cmbP(this)">${esc(o)}</button>`).join('')}<div class="lbl cmbn" style="display:none;padding:8px 10px"></div></div></div>`}
function cmbF(el){const w=el.closest('.cmb'),q=el.value.trim().toLowerCase();let n=0,ex=false;
  w.querySelectorAll('.cmbo').forEach(b=>{const v=b.dataset.v.toLowerCase(),show=!q||v.includes(q);b.style.display=show?'':'none';if(show)n++;if(v===q)ex=true;b.classList.toggle('on',v===q)});
  const m=w.querySelector('.cmbn');m.style.display=q&&!ex?'':'none';m.textContent='New category: '+el.value.trim()+(n?'':' (no match in the list)')}
function cmbP(b){const w=b.closest('.cmb'),i=w.querySelector('input');i.value=b.dataset.v;cmbF(i);w.querySelectorAll('.cmbo').forEach(x=>x.style.display='')}
// checklist field: all ticked is saved as '' (= every product, also ones added later)
function chkHtml(f){const on=id=>!f.val||f.val.includes(id);
  return `<div class="ckl" data-k="${f.k}" data-checks><div class="ckh"><input placeholder="Search" oninput="ckFilter(this)"><button type="button" class="btn sec" onclick="ckAll(this,true)">All</button><button type="button" class="btn sec" onclick="ckAll(this,false)">None</button><span class="lbl ckn"></span></div><div class="ckb">${f.opts.length?f.opts.map(o=>`<label class="ck" data-q="${esc((o[1]+' '+o[2]).toLowerCase())}"><input type="checkbox" value="${esc(o[0])}" ${on(o[0])?'checked':''} onchange="ckCount(this)"><span>${esc(o[1])}${o[2]?`<small>${esc(o[2])}</small>`:''}</span></label>`).join(''):'<div class="lbl" style="padding:10px">No products yet.</div>'}</div></div>`}
function chkVal(e){const b=[...e.querySelectorAll('.ckb input')],c=b.filter(x=>x.checked).map(x=>x.value);return c.length===b.length?'':JSON.stringify(c)}
function ckCount(el){const w=el.closest('.ckl'),b=w.querySelectorAll('.ckb input');w.querySelector('.ckn').textContent=[...b].filter(x=>x.checked).length+' of '+b.length}
function ckAll(el,v){const w=el.closest('.ckl');w.querySelectorAll('.ck').forEach(l=>{if(l.style.display!=='none')l.querySelector('input').checked=v});ckCount(el)}
function ckFilter(el){const q=el.value.trim().toLowerCase();el.closest('.ckl').querySelectorAll('.ck').forEach(l=>l.style.display=!q||l.dataset.q.includes(q)?'':'none')}
function close(){closePop();$('#bg').classList.remove('open')}
$('#bg').onclick=e=>{if(e.target.id==='bg')close()};
// PIN lock: asked once per browser tab when a PIN is set. Data is not drawn until unlocked.
const LOCKK='wismir_unlocked';
function markUnlocked(){try{sessionStorage.setItem(LOCKK,'1')}catch(e){}}
function isUnlocked(){try{return sessionStorage.getItem(LOCKK)==='1'}catch(e){return false}}
let lockTries=0,lockUntil=0;
function showLock(){
  locked=true;applyTheme();$('#app').innerHTML='';$('#lock').classList.add('open');
  const i=$('#lockpin'),go=()=>{
    const e=$('#lockerr');
    if(Date.now()<lockUntil)return e.textContent='Too many tries. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' s.';
    if(i.value===S.cfg.pin){markUnlocked();locked=false;$('#lock').classList.remove('open');i.value='';e.textContent='';start();return}
    lockTries++;i.value='';
    if(lockTries>=5){lockTries=0;lockUntil=Date.now()+30000;e.textContent='Too many tries. Wait 30 s.'}else e.textContent='Wrong PIN.';
  };
  $('#lockok').onclick=go;i.onkeydown=ev=>{if(ev.key==='Enter')go()};
  setTimeout(()=>i.focus(),50);
}
function start(){
  initNav();runRecurring();render();
  setTimeout(()=>document.querySelectorAll('nav').forEach(n=>n.classList.add('ready')),80);
  if(S.cfg.url)pullSheets();
}
if(S.cfg.pin&&!isUnlocked())showLock();else start();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
