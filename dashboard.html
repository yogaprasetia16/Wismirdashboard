:root{--viz1:#2b2622;--viz2:#ee6a2c;--viz1s:#bfb3a2;--ink:#1a1714;--dark:#181512;--mute:#776b5d;--line:#e5d9c5;--green:#3e7a52;--good:#3e7a52;--acc:#ee6a2c;--acct:#b2471b;--onacc:#1a1512;--amber:#ee6a2c;--red:#c0392b;--blue:#9a4318;--card:#fbf6ee;--panel:rgba(251,246,238,.74);--pborder:rgba(255,251,244,.9);--seg:#eadfcd;--sec:#eee4d3;--sheet:#f8f1e6;--thbg:#ebdcc4;--warnbg:#f7ddc9;--bg1:#eeddc2;--bg2:#f6ebdd;--bg3:#f3eadb;--hmute:#a89b8a;--hsoft:#d8cdbe;--chkb:#c9bba5;color-scheme:light}

<script>
const $=s=>document.querySelector(s);
const KEY='wismir_v1';
const rp=n=>'Rp\u00a0'+Math.round(n||0).toLocaleString('id-ID');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const SHEET={tx:'Keuangan',products:'Stok',tasks:'Tugas',prod:'Production',mkt:'Marketing',purch:'Purchasing',staff:'Staff',stores:'Store',supp:'Supplier',hist:'Penjualan',rec:'Recurring',ann:'Annual'};
const POSK={produk:'POS Produk',karyawan:'POS Karyawan',stok:'POS Stok',shift:'POS Shift',absen:'POS Absen',harian:'POS Harian'};
let S={tx:[],products:[],tasks:[],prod:[],mkt:[],purch:[],staff:[],stores:[],supp:[],hist:[],rec:[],ann:[],pos:{},cfg:{url:'',pin:''}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.pos=S.pos||{};
// Dates from Google Sheets can arrive as "2026-11-03T17:00:00.000Z"; turn them back into a local yyyy-mm-dd
const nd=v=>{if(v==null||v==='')return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?s:ymd(d)};
const DKEYS=['tanggal','date','start','end','joined','tempo','paidOn','next'];
const normRow=o=>{DKEYS.forEach(k=>{if(k in o)o[k]=nd(o[k])});return o};
for(const k in SHEET)S[k]=(S[k]||[]).map(normRow);
S.tx.forEach(t=>{t.jenis=t.jenis==='Masuk'?'Income':t.jenis==='Keluar'?'Expense':t.jenis});
let fv='tx',SY='',SSt='all',EY='',ECat='all',OM='',PY='',MY='',SPY='',PRY='',FM='',pop=null,tf='all',tab='home',ops='stock',pt='purch',txf='Income',status='',stv='list';
// stock history filters
const HF={per:'30d',from:'',to:'',loc:'all',cat:'all',brand:'all',type:'all',q:'',n:200};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
tx:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>',
prod:'<path d="M3 21V10l6 4v-4l6 4V6h6v15z"/>',
mkt:'<path d="M3 11v2a1 1 0 0 0 1 1h2l8 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M18 9a4 4 0 0 1 0 6"/>',
ops:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
task:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
late:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
nod:'<path d="M4 7h16M4 12h16M4 17h10"/>',
set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// cfg.dirty counts local changes not yet confirmed by Sheets; cfg.pulled = Sheets was loaded at least once
function save(push=true){
  if(push&&S.cfg.url)S.cfg.dirty=(S.cfg.dirty||0)+1;
  persist();
  if(push&&S.cfg.url){clearTimeout(save.t);save.t=setTimeout(pushSheets,1200)}
  render();
}
const dashData=()=>{const d={};for(const k in SHEET)d[SHEET[k]]=S[k];return d};
const hhmm=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
// S.base = copy of the Sheet as this device last saw it; local edits = differences from it
const snap=()=>JSON.parse(JSON.stringify(dashData()));
// Code.gs version this dashboard expects (must match CODE_VERSION in Code.gs)
const NEED_CODE=13;
// An older Code.gs leaves out columns it does not know yet: keep this device's values for those keys
// instead of wiping them, so a new field survives until Code.gs is updated (then they reach the Sheet).
let kmN=0; // values kept this way: they still have to reach the Sheet
function keepMissing(rows,old){const m={};(old||[]).forEach(o=>m[o.id]=o);return rows.map(r=>{const o=m[r.id];if(!o)return r;const x={...r};for(const k in o)if(!(k in r)){x[k]=o[k];if(o[k]!==''&&o[k]!=null)kmN++}return x})}
function setBase(ver){S.cfg.ver=ver==null?S.cfg.ver:String(ver);S.base=snap()}
// Apply this device's edits (added / changed / deleted rows, by id) on top of fresh Sheet data
// A tab the Sheet only just got (Code.gs updated late) arrives empty: keep this device's rows and send them
// Safety net (2026-11-11): a tab that comes back EMPTY from the Sheet while this device holds many rows of it that it had
// already seen on the Sheet means the Sheet lost them (cleared by mistake or a failed write): keep them here and send them back.
let emptied=[],rescued='';
const lostTab=(n,d)=>{const k=Object.keys(SHEET).find(x=>SHEET[x]===n);return !d.length&&(S[k]||[]).length>=10&&(((S.base||{})[n])||[]).length>=10};
const newTab=(n,d)=>!(S.cfg.tabs||['Keuangan','Stok','Tugas','Production','Marketing','Purchasing','Staff','Store']).includes(n)&&!d.length&&(S[Object.keys(SHEET).find(k=>SHEET[k]===n)]||[]).length;
function mergeInto(server){
  const base=S.base||{};
  for(const k in SHEET){
    const n=SHEET[k],srv=keepMissing((server[n]||[]).map(normRow),S[k]);
    if(!server[n]||newTab(n,server[n]))continue;
    if(lostTab(n,server[n])){emptied.push(n);continue}
    const b={};(base[n]||[]).forEach(x=>b[x.id]=JSON.stringify(x));
    const mine={};S[k].forEach(x=>mine[x.id]=x);
    const gone=new Set(Object.keys(b).filter(id=>!mine[id]));
    const out=srv.filter(x=>!gone.has(String(x.id)));
    const at={};out.forEach((x,i)=>at[x.id]=i);
    S[k].forEach(x=>{if(b[x.id]===JSON.stringify(x))return;if(at[x.id]!=null)out[at[x.id]]=x;else out.push(x)});
    S[k]=out;
  }
}
let syncN=0,syncT0=0,syncOk=true;
function syncUi(on){
  if(on){if(!syncN++)syncT0=Date.now()}else syncN=Math.max(0,syncN-1);
  const b=$('#sync');if(!b)return;
  const show=busy=>{b.classList.toggle('busy',busy);b.classList.toggle('bad',!busy&&!syncOk);b.setAttribute('aria-busy',String(busy));$('#syncLbl').textContent=busy?'Syncing…':'Sync';b.title=busy?'Syncing with Google Sheets':(syncOk?'Sync with Google Sheets':'Last sync failed: '+status)};
  if(syncN){show(true);return}
  setTimeout(()=>{if(!syncN)show(false)},Math.max(0,600-(Date.now()-syncT0)));
}
const tracked=f=>async function(...a){syncUi(true);try{return await f.apply(this,a)}finally{syncUi(false)}};
const pushSheets=tracked(_pushSheets),pullSheets=tracked(_pullSheets);
async function _pushSheets(tries=0){
  if(!S.cfg.url)return setStatus('Add your Google Sheets URL in Settings first.');
  // Never overwrite Sheets from a device that has not loaded it yet (e.g. a new computer)
  if(!S.cfg.pulled)return pullSheets();
  clearTimeout(save.t);
  setStatus('Sending to Google Sheets…');
  const d0=S.cfg.dirty,sent=snap(),B0=S.base||{},data={};
  for(const n in sent)if(JSON.stringify(sent[n])!==JSON.stringify(B0[n]))data[n]=sent[n];
  if(!Object.keys(data).length){if(S.cfg.dirty===d0)S.cfg.dirty=0;persist();return setStatus('Synced '+hhmm())}
  try{
    const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin:S.cfg.pin,data,base:S.cfg.ver})});
    const j=await r.json();
    if(j.ok){if(j.ver)S.cfg.ver=String(j.ver);S.base=sent;if(S.cfg.dirty===d0)S.cfg.dirty=0;persist();setStatus(rescued?rescued+' · sent back '+hhmm():'Synced '+hhmm());rescued='';if(S.cfg.dirty)save.t=setTimeout(pushSheets,1200)}
    else if(j.conflict&&tries<3){
      // Another device saved in the meantime: load its data, keep both sets of changes, send again
      setStatus('Merging changes from another device…');
      const g=await (await fetch(S.cfg.url+'?pin='+encodeURIComponent(S.cfg.pin))).json();
      if(!g.ok)return setStatus('Failed: '+(g.error||'wrong PIN'));
      mergeInto(g.data);S.cfg.ver=String(g.ver);S.base=JSON.parse(JSON.stringify(g.data));
      for(const k in POSK){const d=g.data[POSK[k]];if(d)S.pos[k]=d}
      persist();render();return pushSheets(tries+1);
    }
    else setStatus('Failed: '+(j.error||'wrong PIN'));
  }catch(e){setStatus('Could not connect. Your data is safe on this device and will be sent next time.')}
}
async function _pullSheets(){
  if(!S.cfg.url)return setStatus('Add your Google Sheets URL in Settings first.');
  // Unsent changes on this device go up first, so loading never overwrites them
  if(S.cfg.pulled&&S.cfg.dirty){
    await pushSheets();
    if(S.cfg.dirty)return setStatus('Your latest changes are not sent yet, so data was not reloaded. They are safe on this device.');
  }
  setStatus('Loading from Google Sheets…');
  try{
    const r=await fetch(S.cfg.url+'?pin='+encodeURIComponent(S.cfg.pin));
    const j=await r.json();
    if(!j.ok)return setStatus('Failed: '+(j.error||'wrong PIN'));
    kmN=0;
    const busy=S.cfg.pulled&&S.cfg.dirty; // edited while loading: keep local, send it instead
    let kept=0;
    if(!busy){
      emptied=[];
      const srvTab={};
      for(const k in SHEET){const d=j.data[SHEET[k]];if(d&&(newTab(SHEET[k],d)||lostTab(SHEET[k],d))){if(!newTab(SHEET[k],d))emptied.push(SHEET[k]);kept++;srvTab[SHEET[k]]=d.map(normRow);continue}if(d){const km0=kmN;S[k]=keepMissing(d.map(normRow),S[k]);if(kmN>km0)srvTab[SHEET[k]]=d.map(normRow)}}
      S.cfg.tabs=Object.keys(j.data);if(kept)kmN++;
      S.tx.forEach(t=>{t.jenis=t.jenis==='Masuk'?'Income':t.jenis==='Keluar'?'Expense':t.jenis});
      S.cfg.pulled=1;S.cfg.dirty=0;setBase(j.ver);Object.assign(S.base,srvTab); // base = what the Sheet has

    }
    for(const k in POSK){const d=j.data[POSK[k]];if(d)S.pos[k]=d}
    S.cfg.codeOld=(+j.v||0)<NEED_CODE;
    // device-only values (older Code.gs): mark as unsent, so they go up before the next load and land once Code.gs is updated
    if(!busy&&(S.cfg.codeOld||kept)&&kmN)S.cfg.dirty=(S.cfg.dirty||0)+1;
    if(emptied.length)rescued='The Sheet tab '+emptied.join(', ')+' came back empty: kept this device\'s rows';
    save(false);setStatus(emptied.length?'The Sheet tab '+emptied.join(', ')+' came back empty: kept this device\'s rows and sent them back to the Sheet '+hhmm():'Data loaded from Sheets '+hhmm());
    if(!busy)runRecurring();
    if(!busy&&migratePos())save(); // sends the merged lists back to Sheets
    if(busy||kept)pushSheets(); // kept: rows of a tab the Sheet only just got go up now
  }catch(e){setStatus('Could not connect to Google Sheets.')}
}
// Closing the tab right after an edit: try one last send (next open sends again if needed)
function flushOnLeave(){if(S.cfg.url&&S.cfg.pulled&&S.cfg.dirty&&typeof navigator!=='undefined'&&navigator.sendBeacon){try{navigator.sendBeacon(S.cfg.url,new Blob([JSON.stringify({pin:S.cfg.pin,data:dashData(),base:S.cfg.ver})],{type:'text/plain'}))}catch(e){}}}
addEventListener('pagehide',flushOnLeave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnLeave();else refresh()});
// Coming back to an open tab (or every 5 minutes): reload so this device never edits stale data
function refresh(){const ae=document.activeElement;if(locked||!S.cfg.url||!S.cfg.pulled||$('#bg').classList.contains('open')||(ae&&ae.tagName==='INPUT'))return;if(Date.now()-(refresh.t||0)<20000)return;refresh.t=Date.now();pullSheets()}
setInterval(()=>{if(document.visibilityState!=='hidden')refresh()},300000);
function setStatus(t){status=t;const e=$('#st');if(e)e.textContent=t;
  // anything that is not progress or success counts as a failed sync (red dot on the Sync button)
  if(!/…$/.test(t))syncOk=!/^(Failed|Could not|Your latest changes are not sent|Add your Google Sheets URL)/.test(t)}

const TABS=[['home','Overview'],['task','Reminders'],['tx','Finance'],['prod','Production'],['mkt','Marketing'],['ops','Operational'],['set','Settings']];
const P=k=>(S.pos&&S.pos[k])||[];
const PEXT=['Supplier','Konveksi','Sale','Rusak/Hilang','Koreksi opname'];
// Stock locations: warehouses + physical stores from Operational > Store (same list the POS uses), then any older names still in POS history
function posLocs(){const nm=t=>S.stores.filter(x=>x.type===t).map(x=>String(x.name||'').trim()).filter(Boolean);const l=[...nm('Warehouse'),...nm('Physical store')];P('stok').forEach(x=>[x.dari,x.ke].forEach(v=>{v=String(v||'');if(v&&!PEXT.includes(v)&&!l.includes(v))l.push(v)}));return l.length?l:['Gudang','Toko A','Toko B']}
function posStock(){const m={},L=posLocs();P('stok').forEach(x=>{if(x.status==='void')return;const q=+x.qty||0,o=m[x.pid]||(m[x.pid]={});if(L.includes(x.ke))o[x.ke]=(o[x.ke]||0)+q;if(L.includes(x.dari))o[x.dari]=(o[x.dari]||0)-q});return m}
const posTotal=(m,id)=>Object.values(m[id]||{}).reduce((a,b)=>a+b,0);
// ---------- stock history (moves recorded on the store tablets) ----------
const MVT={sale:'Sale',in:'Stock in',out:'Stock out',tf:'Transfer',loss:'Damaged / lost',opname:'Stock count'};
function mvKind(x){const f=String(x.dari||''),t=String(x.ke||'');return x.jenis==='sale'||t==='Sale'||f==='Sale'?'sale':t==='Rusak/Hilang'?'loss':(f==='Koreksi opname'||t==='Koreksi opname')?'opname':['Supplier','Konveksi'].includes(f)?'in':['Supplier','Konveksi'].includes(t)?'out':'tf'}
const LOCNAME={'Sale':'Sold','Rusak/Hilang':'Damaged / lost','Koreksi opname':'Stock count'};
const locName=v=>LOCNAME[v]||v;
function perRange(){const T=today(),d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)},m0=T.slice(0,7)+'-01';
  const lm=(()=>{const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-1);return ymd(x)})();
  return {today:[T,T],'7d':[d(6),T],'30d':[d(29),T],month:[m0,T],last:[lm,(()=>{const x=new Date(m0+'T00:00');x.setDate(0);return ymd(x)})()],all:['',''],custom:[HF.from,HF.to]}[HF.per]||['','']}
function histRows(){
  const [a,b]=perRange(),pm={};S.products.forEach(p=>pm[p.id]=p);
  const q=HF.q.trim().toLowerCase();
  return P('stok').filter(x=>{
    const d=nd(x.tanggal),p=pm[x.pid]||{};
    if(a&&d<a||b&&d>b)return false;
    if(HF.loc!=='all'&&x.dari!==HF.loc&&x.ke!==HF.loc)return false;
    if(HF.cat!=='all'&&String(p.kategori||'')!==HF.cat)return false;
    if(HF.brand!=='all'&&String(p.brand||'')!==HF.brand)return false;
    if(HF.type!=='all'&&mvKind(x)!==HF.type)return false;
    if(q&&!(String(x.produk||p.nama||'')+' '+String(p.sku||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((x,y)=>(+y.t||0)-(+x.t||0)||String(y.tanggal).localeCompare(String(x.tanggal)));
}
function hList(){
  const r=histRows(),live=r.filter(x=>x.status!=='void'),pm={};S.products.forEach(p=>pm[p.id]=p);
  // in/out from the point of view of the chosen location (or of the business as a whole)
  const sign=x=>HF.loc!=='all'?(x.ke===HF.loc?1:-1):(['in'].includes(mvKind(x))||(mvKind(x)==='opname'&&x.dari==='Koreksi opname')?1:['tf'].includes(mvKind(x))?0:-1);
  let pin=0,pout=0;live.forEach(x=>{const v=+x.qty||0,sg=sign(x);if(sg>0)pin+=v;else if(sg<0)pout+=v});
  let last='',html='';
  r.slice(0,HF.n).forEach(x=>{const d=nd(x.tanggal);if(d!==last){last=d;html+=`<div class="sub" style="margin:14px 2px 6px">${d===today()?'Today':fmtD(d)}</div>`}
    const p=pm[x.pid]||{},k=mvKind(x),sg=sign(x),v=x.status==='void';
    html+=`<div class="row${v?' fut':''}" style="cursor:default"><div class="grow"><div class="t">${esc(x.produk||p.nama||'(deleted product)')}${p.sku?' <span class="lbl">· '+esc(p.sku)+'</span>':''}</div><div class="lbl">${esc(x.jam||'')} · ${esc(locName(x.dari))} → ${esc(locName(x.ke))}${x.oleh?' · '+esc(x.oleh):''}${x.catatan?' · '+esc(x.catatan):''}${v?' · cancelled':''}</div></div><div style="text-align:right"><span class="pill${k==='sale'||k==='loss'||k==='out'?' warn':''}">${MVT[k]}</span><div><b class="${v?'':sg>0?'pos':sg<0?'neg':''}" style="${v?'text-decoration:line-through':''}">${sg>0?'+':sg<0?'−':''}${+x.qty||0}</b></div></div></div>`});

function expParse(text){

  const cells=lines.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
  const head=cells[0].map(h=>h.toLowerCase().replace(/\s+/g,' ').trim()),map={};
  head.forEach((h,i)=>{for(const k in ECOL)if(map[k]==null&&ECOL[k].test(h))map[k]=i});

  (hasHead?cells.slice(1):cells).forEach(c=>{const d=eDate(c[M.d]),v=+impNum(c[M.v])||0;if(!d||!v){bad++;return}
    const r={tanggal:d,kategori:ecap(c[M.c]),jumlah:v,catatan:String(c[M.n]||'').trim()},k=[r.tanggal,r.kategori.toLowerCase(),r.jumlah,r.catatan].join('|');seen[k]=(seen[k]||0)+1;

const SPCOL={d:/^(tanggal|tgl|date|tanggal bayar|payment date|paid on)$/,v:/^(jumlah|amount|nominal|total|pembayaran|payment|bayar|nilai|nilai pembayaran)$/};
function suppPayParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return{rows:[],bad:0};
  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const cells=lines.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
  const head=cells[0].map(h=>h.toLowerCase().replace(/\s+/g,' ').trim()),map={};
  head.forEach((h,i)=>{for(const k in SPCOL)if(map[k]==null&&SPCOL[k].test(h))map[k]=i});
  const hasHead=map.d!=null&&map.v!=null,M=hasHead?map:{d:0,v:1},g={};let bad=0,n=0;
  (hasHead?cells.slice(1):cells).forEach(c=>{const d=eDate(c[M.d]),v=+impNum(c[M.v])||0;if(!d||!v){bad++;return}n++;
    const m=prevMon(d.slice(0,7)),o=g[m]||(g[m]={id:'sup-'+m,bulan:m,total:0,paidOn:d,n:0});o.total+=v;o.n++;if(d>o.paidOn)o.paidOn=d});
  return{rows:Object.values(g).sort((a,b)=>a.bulan.localeCompare(b.bulan)),bad,n};
}

// For each product × location: system stock = POS stock moves up to the end of that date (without this import's own earlier
// rows); one "Koreksi opname" move of the difference is written to POS Stok (id op-<date>-<product>-<location>, so importing

    const l=locOf(loc);if(!l){if(loc)missLoc.add(loc);return}const n=mNum(q);if(String(q).trim()===''||isNaN(n)){bad++;return}out[p.id+'|'+l]={p,l,count:n}};

function impParse(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return{map:{},rows:[]};
  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const cells=lines.map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
  const head=cells[0].map(h=>h.toLowerCase().replace(/\s+/g,' ').trim()),map={};
  head.forEach((h,i)=>{for(const k in IMPCOL)if(map[k]==null&&IMPCOL[k].test(h))map[k]=i});
  let body=cells.slice(1);
  if(map.nama==null){IMPORDER.forEach((k,i)=>map[k]=i);body=cells} // no header row: Product, Category, Brand, SKU, COGS
  const seen=new Set(S.products.map(p=>String(p.sku||'').trim().toLowerCase()).filter(Boolean));
  const rows=body.map(c=>{const g=k=>map[k]==null?'':String(c[map[k]]||'').trim();
    const r={nama:g('nama'),kategori:g('kategori'),brand:g('brand'),sku:g('sku'),cogs:map.cogs==null?'':impNum(g('cogs'))},k=r.sku.toLowerCase();
    r.st=!r.nama?'skip: no name':k&&seen.has(k)?'skip: SKU already exists':'new';if(r.st==='new'&&k)seen.add(k);return r});

}

function ckFilter(el){const q=el.value.trim().toLowerCase();el.closest('.ckl').querySelectorAll('.ck').forEach(l=>l.style.display=!q||l.dataset.q.includes(q)?'':'none')}
function close(){closePop();$('#bg').classList.remove('open')}
$('#bg').onclick=e=>{if(e.target.id==='bg')close()};
// PIN lock: asked once per browser tab when a PIN is set. Data is not drawn until unlocked.
const LOCKK='wismir_unlocked';
function markUnlocked(){try{sessionStorage.setItem(LOCKK,'1')}catch(e){}}
function isUnlocked(){try{return sessionStorage.getItem(LOCKK)==='1'}catch(e){return false}}
let lockTries=0,lockUntil=0;
function showLock(){
  locked=true;applyTheme();$('#app').innerHTML='';$('#lock').classList.add('open');
  const i=$('#lockpin'),go=()=>{
    const e=$('#lockerr');
    if(Date.now()<lockUntil)return e.textContent='Too many tries. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' s.';
    if(i.value===S.cfg.pin){markUnlocked();locked=false;$('#lock').classList.remove('open');i.value='';e.textContent='';start();return}
    lockTries++;i.value='';
    if(lockTries>=5){lockTries=0;lockUntil=Date.now()+30000;e.textContent='Too many tries. Wait 30 s.'}else e.textContent='Wrong PIN.';
  };
  $('#lockok').onclick=go;i.onkeydown=ev=>{if(ev.key==='Enter')go()};
  setTimeout(()=>i.focus(),50);
}
function start(){
  initNav();runRecurring();render();
  setTimeout(()=>document.querySelectorAll('nav').forEach(n=>n.classList.add('ready')),80);
  if(S.cfg.url)pullSheets();
}
if(S.cfg.pin&&!isUnlocked())showLock();else start();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
