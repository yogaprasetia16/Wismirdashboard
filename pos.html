<script>
(function(){
'use strict';

let seq=0;const uid=p=>p+Date.now().toString(36).toUpperCase()+(seq++).toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase();

 plus:'<path d="M12 5v14M5 12h14"/>',

 cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',

 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.3 7.6A17 17 0 0 0 2 12s3.6 6 10 6c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1"/>'
};
const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';

/* ---------- state & storage ---------- */
const KEY='wismir_pos_v1';
const LOCS=['Gudang','Toko A','Toko B'], STORES=['Toko A','Toko B'];
const REAL=l=>LOCS.indexOf(l)>=0;
const METHODS=['Tunai','Transfer','EDC'];
const blank=()=>({v:1,cfg:{store:'Toko A',pin:'1234'},products:[],staff:[],moves:[],txs:[],shifts:[],attendance:[],prices:{},shift:null,cart:[],holds:[],seeded:false});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.products))return o}}catch(e){}return null}
let S=load()||blank();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan di tablet. Penyimpanan penuh?')}}
function seed(){
 const P=[["Gamis Syar'i Navy",'Gamis'],['Gamis Polos Hitam','Gamis'],['Gamis Brokat Maroon','Gamis'],['Khimar Instan Cream','Hijab'],['Pashmina Ceruty Sage','Hijab'],['Hijab Segi Empat Voal','Hijab'],['Abaya Dubai Mocha','Abaya'],['Koko Pria Putih','Koko'],['Mukena Katun Jepang','Mukena'],['Sarung Tenun Premium','Sarung']];
 P.forEach(p=>S.products.push({id:uid('P'),name:p[0],category:p[1],active:true}));
 [['Rina','Toko A'],['Budi','Toko A'],['Sari','Toko B'],['Andi','Toko B']].forEach(s=>S.staff.push({id:uid('K'),name:s[0],store:s[1],active:true}));
 const t=Date.now()-86400000;
 S.products.forEach((p,i)=>{[['Gudang',40+i],['Toko A',8+i%4],['Toko B',6+i%3]].forEach(x=>S.moves.push({id:uid('M'),t:t,pid:p.id,from:'Supplier',to:x[0],qty:x[1],by:'Contoh',note:'Stok awal contoh',status:'ok',kind:'manual'}))});
 S.seeded=true;save();
}
if(!S.seeded&&!S.products.length)seed();
S.cfg=S.cfg||{store:'Toko A',pin:'1234'};S.holds=S.holds||[];S.outbox=S.outbox||[];S.since=S.since||0;

/* ---------- ui state ---------- */
let showKpi=false,tab='home',ownerOK=false,osub='report',rPer='today',rStore='all';
const curLoc=()=>ownerOK?stLoc:S.cfg.store;
let stLoc=S.cfg.store,stView='hist',stQ='',posCat='Semua',allStaff=false,draft={cash:''},sel=new Set(),MV=null,SC=null,PAY=null;

/* ---------- data helpers ---------- */
const prod=id=>S.products.find(p=>p.id===id);
const pname=id=>prod(id)?prod(id).name:'(produk dihapus)';
const activeProducts=()=>S.products.filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
function stockMap(loc){const m={};for(const x of S.moves){if(x.status==='void')continue;if(x.to===loc)m[x.pid]=(m[x.pid]||0)+x.qty;if(x.from===loc)m[x.pid]=(m[x.pid]||0)-x.qty}return m}
function soldNow(){const m={};if(!S.shift)return m;for(const t of S.txs){if(t.shiftId!==S.shift.id||t.void)continue;for(const i of t.items)m[i.pid]=(m[i.pid]||0)+i.qty}return m}
function availMap(loc){const m=stockMap(loc);if(S.shift&&S.shift.store===loc){const s=soldNow();for(const k in s)m[k]=(m[k]||0)-s[k]}return m}
function shiftStats(sh){sh=sh||S.shift;if(!sh)return null;const tx=S.txs.filter(t=>t.shiftId===sh.id&&!t.void);const by={};let total=0;tx.forEach(t=>{total+=t.total;if(t.pays)t.pays.forEach(x=>by[x.method]=(by[x.method]||0)+x.amount);else by[t.method]=(by[t.method]||0)+t.total});const cash=by.Tunai||0;const cm=sh.cashMoves||[];const cin=sum(cm.filter(x=>x.type==='in'),x=>x.amount),cout=sum(cm.filter(x=>x.type==='out'),x=>x.amount);return{tx:tx,total:total,by:by,cash:cash,cin:cin,cout:cout,n:tx.length,expected:sh.cashStart+cash+cin-cout}}
function topPrices(pid){const h=S.prices[pid]||{};return Object.keys(h).map(k=>({p:+k,n:h[k].n,t:h[k].t})).sort((a,b)=>b.n-a.n||b.t-a.t).slice(0,5)}
const cartTotal=()=>sum(S.cart,c=>c.price*c.qty);
const cartQty=()=>sum(S.cart,c=>c.qty);

/* ---------- sinkron Google Sheets ----------
   Stok, produk & karyawan: dikirim langsung (antre bila internet lambat/putus).
   Kasir (struk), shift & absen: dikirim sekali saat tutup shift, supaya kasir tidak pernah menunggu jaringan.
   Semua pengiriman berjalan di belakang layar; data tetap aman di tablet sampai terkirim. */
const COL={'POS Produk':'products','POS Karyawan':'staff','POS Stok':'moves','POS Kasir':'txs','POS Shift':'shifts','POS Absen':'attendance'};
const J=(v,d)=>{try{return v===''||v==null?d:JSON.parse(v)}catch(e){return d}};
const s0=v=>v==null?'':String(v);
const SER={
 'POS Produk':p=>({id:p.id,nama:p.name,kategori:p.category||'',aktif:p.active===false?'0':'1'}),
 'POS Karyawan':k=>({id:k.id,nama:k.name,aktif:k.active===false?'0':'1'}),
 'POS Stok':m=>({id:m.id,tanggal:ymd(m.t),jam:hm(m.t),produk:pname(m.pid),dari:m.from,ke:m.to,qty:m.qty,oleh:m.by||'',catatan:m.note||'',status:m.status||'ok',jenis:m.kind||'',ref:m.ref||'',pid:m.pid,t:String(m.t)}),
 'POS Kasir':t=>({id:t.id,tanggal:ymd(t.t),jam:hm(t.t),toko:t.store,shiftId:t.shiftId,metode:t.method,total:t.total,dibayar:t.paid,kembalian:t.change||0,rincian:t.items.map(i=>i.name+' x'+i.qty+' @'+dot(i.price)).join('; '),status:t.void?'VOID':t.edited?'DIUBAH':'OK',items:JSON.stringify(t.items),pays:JSON.stringify(t.pays||[]),t:String(t.t)}),
 'POS Shift':h=>({id:h.id,tanggal:ymd(h.openedAt),toko:h.store,buka:hm(h.openedAt),tutup:hm(h.closedAt),karyawan:(h.staff||[]).join(', '),kasAwal:h.cashStart||0,penjualanTunai:h.cashSales||0,kasMasuk:h.cashIn||0,kasKeluar:h.cashOut||0,kasSeharusnya:h.expected||0,tunai:(h.by||{}).Tunai||0,transfer:(h.by||{}).Transfer||0,edc:(h.by||{}).EDC||0,totalPenjualan:h.total||0,transaksi:h.n||0,mutasiKas:JSON.stringify(h.cashMoves||[]),tBuka:String(h.openedAt),tTutup:String(h.closedAt)}),
 'POS Absen':a=>({id:a.id,tanggal:a.date||ymd(a.t),jam:hm(a.t),toko:a.store,nama:a.name,shiftId:a.shiftId,staffId:a.staffId,t:String(a.t)})
};
const DES={
 'POS Produk':r=>({id:s0(r.id),name:s0(r.nama),category:s0(r.kategori),active:s0(r.aktif)!=='0'}),
 'POS Karyawan':r=>({id:s0(r.id),name:s0(r.nama),active:s0(r.aktif)!=='0'}),
 'POS Stok':r=>{const o={id:s0(r.id),t:+r.t||0,pid:s0(r.pid),from:s0(r.dari),to:s0(r.ke),qty:+r.qty||0,by:s0(r.oleh),note:s0(r.catatan),status:s0(r.status)||'ok',kind:s0(r.jenis)||'manual'};if(r.ref)o.ref=s0(r.ref);return o},
 'POS Kasir':r=>{const o={id:s0(r.id),shiftId:s0(r.shiftId),store:s0(r.toko),t:+r.t||0,method:s0(r.metode),pays:J(r.pays,[]),total:+r.total||0,paid:+r.dibayar||0,change:+r.kembalian||0,items:J(r.items,[])};if(r.status==='VOID')o.void=true;if(r.status==='DIUBAH')o.edited=true;return o},
 'POS Shift':r=>{const by={};[['Tunai',r.tunai],['Transfer',r.transfer],['EDC',r.edc]].forEach(x=>{if(+x[1])by[x[0]]=+x[1]});const st=s0(r.karyawan);return{id:s0(r.id),store:s0(r.toko),openedAt:+r.tBuka||0,closedAt:+r.tTutup||0,staff:st?st.split(', '):[],cashStart:+r.kasAwal||0,cashSales:+r.penjualanTunai||0,expected:+r.kasSeharusnya||0,cashIn:+r.kasMasuk||0,cashOut:+r.kasKeluar||0,cashMoves:J(r.mutasiKas,[]),cashEnd:null,diff:null,total:+r.totalPenjualan||0,by:by,n:+r.transaksi||0}},
 'POS Absen':r=>({id:s0(r.id),shiftId:s0(r.shiftId),t:+r.t||0,date:s0(r.tanggal),store:s0(r.toko),staffId:s0(r.staffId),name:s0(r.nama)})
};
const syncOn=()=>!!(S.cfg.url&&S.cfg.spin);
let syncErr='',flushing=false,pulling=false,ft=null,tries=0,needRender=false;
function enqueue(sheet,rec){if(!rec||!rec.id)return;S.outbox=S.outbox.filter(x=>!(x.s===sheet&&x.id===rec.id));S.outbox.push({s:sheet,id:rec.id,r:SER[sheet](rec)})}
function kick(ms){if(!syncOn())return;clearTimeout(ft);ft=setTimeout(flush,ms==null?400:ms)}
async function flush(){
 if(!syncOn()||flushing)return;
 if(!S.outbox.length)return pull();
 flushing=true;const batch=S.outbox.slice(0,200),rows={};batch.forEach(x=>(rows[x.s]=rows[x.s]||[]).push(x.r));
 try{
  const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin:S.cfg.spin,action:'upsert',rows:rows})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Ditolak server');
  S.outbox=S.outbox.filter(x=>batch.indexOf(x)<0);tries=0;syncErr='';S.lastSync=Date.now();save();
  flushing=false;if(S.outbox.length)kick(0);else pull();
 }catch(e){flushing=false;tries++;syncErr=(e&&e.message)||'Tidak ada koneksi';kick(Math.min(60000,2000*Math.pow(2,tries-1)));syncUi()}
}
async function pull(){
 if(!syncOn()||pulling)return;pulling=true;
 try{
  const r=await fetch(S.cfg.url+'?pos=1&pin='+encodeURIComponent(S.cfg.spin)+'&since='+(S.since||0));
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Ditolak server');
  let ch=false;
  Object.keys(COL).forEach(sh=>{
   const rows=(j.data&&j.data[sh])||[];if(!rows.length)return;
   const arr=S[COL[sh]],idx={};arr.forEach((x,i)=>idx[x.id]=i);
   rows.forEach(row=>{
    const o=DES[sh](row);if(!o.id)return;
    if(S.outbox.some(x=>x.s===sh&&x.id===o.id))return;                       // versi tablet ini belum terkirim: tetap pakai yang lokal
    if(S.shift&&o.shiftId===S.shift.id&&(sh==='POS Kasir'||sh==='POS Absen'))return; // shift berjalan dikelola tablet ini
    const i=idx[o.id];
    if(i==null){idx[o.id]=arr.push(o)-1;ch=true}else if(JSON.stringify(arr[i])!==JSON.stringify(o)){arr[i]=o;ch=true}
   });
  });
  if(ch){S.shifts.sort((a,b)=>a.closedAt-b.closedAt);S.txs.sort((a,b)=>a.t-b.t)}
  S.since=Math.max(0,(+j.now||0)-5000);S.lastSync=Date.now();syncErr='';save();
  if(ch)softRender();
 }catch(e){syncErr=(e&&e.message)||'Tidak ada koneksi'}
 finally{pulling=false;syncUi()}
}
// Jangan ganggu kasir: kalau ada form terbuka atau sedang mengetik, tampilan diperbarui setelahnya
function softRender(){const ae=document.activeElement;if($('#bg').classList.contains('open')||(ae&&ae.tagName==='INPUT'&&$('#app').contains(ae))){needRender=true;return}render()}
function syncText(){if(!syncOn())return 'Belum terhubung ke Google Sheets.';const n=S.outbox.length;return (n?n+' data menunggu dikirim':'Semua data sudah terkirim')+(S.lastSync?' · sinkron terakhir '+dm(S.lastSync)+' '+hm(S.lastSync):'')+(syncErr?' · <span class="neg">'+esc(syncErr)+'</span>':'')}
function syncUi(){const e=$('#syncst');if(e)e.innerHTML=syncText()}

/* ---------- ui helpers ---------- */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2300)}
function openSheet(html,focus){delete $('#sheet').dataset.tone;$('#sheet').innerHTML='<button class="xbtn" data-a="x" aria-label="Tutup" title="Tutup">'+svg('x')+'</button>'+html;$('#bg').classList.add('open');$('#sheet').scrollTop=0;if(focus!==false)setTimeout(()=>{const f=$('#sheet [data-focus]');if(f)f.focus()},60)}
function closeSheet(){$('#bg').classList.remove('open');$('#sheet').innerHTML='';MV=null;SC=null;PAY=null;if(needRender){needRender=false;setTimeout(render,0)}}
function err(m){const e=$('#err');if(e)e.textContent=m||''}
function twoTap(el,msg,fn){if(el.dataset.arm){clearTimeout(el._t);delete el.dataset.arm;fn();return}const old=el.innerHTML;el.textContent=msg;el.dataset.arm='1';el._t=setTimeout(()=>{el.innerHTML=old;delete el.dataset.arm},3000)}
function selHtml(id,opts,cur,attr){return '<select id="'+id+'" '+(attr||'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>'}
function download(name,text,type){try{const b=new Blob([text],{type:type||'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('Unduhan tidak didukung di sini')}}
function csv(rows){return '﻿'+rows.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n')}

 const t=S.txs.find(x=>x.id===SC.eid);const items=[];
 for(let k=0;k<t.items.length;k++){const p=num($('[data-ei="'+k+'"][data-f=price]').value),q=num($('[data-ei="'+k+'"][data-f=qty]').value);if(q<=0)continue;if(p<=0)return err('Isi harga untuk '+t.items[k].name+'.');items.push({pid:t.items[k].pid,name:t.items[k].name,qty:q,price:p})}

 const total=sum(items,i=>i.qty*i.price),oldM=t.method,m=SC.method;
 const closed=S.shifts.some(x=>x.id===t.shiftId);
 if(closed){const d={};t.items.forEach(i=>d[i.pid]=(d[i.pid]||0)-i.qty);items.forEach(i=>d[i.pid]=(d[i.pid]||0)+i.qty);Object.keys(d).forEach(pid=>saleCorr(t,pid,d[pid],'Koreksi struk'))}

};

 else{
  if(q<=0)return fail('Isi jumlah lebih dari 0.');
  if(m.from===m.to)return fail('Asal dan tujuan tidak boleh sama.');
  if(!ownerOK&&m.mode==='tf'&&m.from!==S.cfg.store&&m.to!==S.cfg.store)return fail('Transfer harus melibatkan '+S.cfg.store+'. Untuk lokasi lain, gunakan mode owner.');
  if(REAL(m.from)){const av=availMap(m.from)[m.pid]||0;if(q>av&&!ownerOK){m.needPin=true;if(m.pin!==S.cfg.pin)return fail('Stok '+m.from+' hanya '+av+'. Masukkan PIN owner untuk tetap melanjutkan.')}}
 }
 m.step='confirm';mvRender();
};
A.mvSave=()=>{
 const m=MV,now=Date.now(),q=num(m.qty);const by=S.cfg.store;
 const push=(from,to,qty,note)=>{const mv={id:uid('M'),t:now,pid:m.pid,from:from,to:to,qty:qty,by:by,note:note,status:'ok',kind:'manual'};S.moves.push(mv);enqueue('POS Stok',mv)};
 if(m.mode==='opname'){const sys=availMap(m.from)[m.pid]||0,d=q-sys,note='Opname: sistem '+sys+', fisik '+q+(m.note?' · '+m.note:'');if(d>0)push('Koreksi opname',m.from,d,note);else push(m.from,'Koreksi opname',-d,note)}
 else push(m.from,m.to,q,m.note);
 save();closeSheet();toast('Pergerakan stok disimpan');render();kick(0);
};
A.void=el=>twoTap(el,'Ketuk lagi untuk batalkan',()=>{const x=S.moves.find(m=>m.id===el.dataset.id);if(x){x.status='void';enqueue('POS Stok',x);save();render();toast('Dibatalkan (void)');kick(0)}});
/* Owner */
A.unlock=()=>{const v=$('#pin').value;if(v===S.cfg.pin){ownerOK=true;render()}else err('PIN salah.')};
A.lock=()=>{ownerOK=false;render()};
A.osub=el=>{osub=el.dataset.s;render()};
A.per=el=>{rPer=el.dataset.p;render()};
A.rst=el=>{rStore=el.dataset.s;render()};
A.prodEdit=el=>productSheet(el&&el.dataset.id?el.dataset.id:null);
A.prodSave=()=>{
 const n=$('#pn').value.trim(),c=$('#pc').value.trim();if(!n)return err('Isi nama produk.');
 if(S.products.some(p=>p.name.toLowerCase()===n.toLowerCase()&&p.id!==SC.prodId))return err('Nama produk sudah ada.');
 let id=SC.prodId;
 if(id){const p=prod(id);p.name=n;p.category=c;const a=$('#pa');if(a)p.active=a.value==='1'}
 else{id=uid('P');S.products.push({id:id,name:n,category:c,active:true})}
 enqueue('POS Produk',prod(id));kick();
 const after=SC.after;save();closeSheet();if(after){after(id)}else render();
};
function staffSheet(id){
 const s=id?S.staff.find(x=>x.id===id):null;SC={staffId:id||null};
 openSheet('<h3>'+(s?'Ubah karyawan':'Karyawan baru')+'</h3><div class="f"><label>Nama</label><input id="sn" value="'+esc(s?s.name:'')+'" data-focus></div>'+
  (s?'<div class="f"><label>Status</label>'+selHtml('sa',[['1','Aktif'],['0','Nonaktif']],s.active===false?'0':'1')+'</div>':'')+'<div class="err" id="err"></div><button class="btn go" data-a="staffSave" data-enter>Simpan</button>');
}
A.staffEdit=el=>staffSheet(el&&el.dataset.id?el.dataset.id:null);
A.staffSave=()=>{
 const n=$('#sn').value.trim();if(!n)return err('Isi nama karyawan.');
 let k;if(SC.staffId){k=S.staff.find(x=>x.id===SC.staffId);k.name=n;k.active=$('#sa').value==='1'}
 else{k={id:uid('K'),name:n,active:true};S.staff.push(k)}
 enqueue('POS Karyawan',k);save();closeSheet();render();kick();
};
// Tablet yang belum pernah dipakai jualan: buang data contoh supaya tidak tercampur dengan data asli di Sheets
function dropDemo(){
 if(S.txs.length||S.shifts.length||S.shift||!S.moves.some(m=>m.by==='Contoh'))return false;
 const real=new Set(S.moves.filter(m=>m.by!=='Contoh').map(m=>m.pid));
 const demoP=new Set(S.moves.filter(m=>m.by==='Contoh').map(m=>m.pid));
 S.moves=S.moves.filter(m=>m.by!=='Contoh');
 S.products=S.products.filter(p=>!demoP.has(p.id)||real.has(p.id));
 const used=new Set(S.attendance.map(a=>a.staffId));
 S.staff=S.staff.filter(k=>['Rina','Budi','Sari','Andi'].indexOf(k.name)<0||used.has(k.id));
 S.outbox=S.outbox.filter(x=>x.s!=='POS Stok'||S.moves.some(m=>m.id===x.id));S.prices={};
 return true;
}
A.gsSave=()=>{const u=$('#gsu').value.trim(),p=$('#gsp').value;if(u&&!/^https?:\/\//.test(u)){toast('URL tidak valid');return}
 const first=!S.cfg.url;if(u!==S.cfg.url||p!==S.cfg.spin)S.since=0;S.cfg.url=u;S.cfg.spin=p;tries=0;syncErr='';
 const dropped=u&&first&&dropDemo();save();render();toast(!u?'Sinkron dimatikan':dropped?'Data contoh dihapus · mengambil data dari Google Sheets…':'Menyinkronkan…');kick(0)};
A.gsAll=el=>twoTap(el,'Ketuk lagi untuk kirim semua data',()=>{if(!syncOn())return toast('Isi URL dan PIN Google Sheets dulu');const cur=S.shift&&S.shift.id;S.products.forEach(p=>enqueue('POS Produk',p));S.staff.forEach(k=>enqueue('POS Karyawan',k));S.moves.forEach(m=>enqueue('POS Stok',m));S.shifts.forEach(h=>enqueue('POS Shift',h));S.txs.filter(t=>t.shiftId!==cur).forEach(t=>enqueue('POS Kasir',t));S.attendance.filter(a=>a.shiftId!==cur).forEach(a=>enqueue('POS Absen',a));save();syncUi();toast(S.outbox.length+' data diantrekan');kick(0)});
A.rcSave=()=>{S.cfg.rc={head:$('#rch').value.trim()||'WISMIR',addr:$('#rca').value.trim(),foot:$('#rcf').value.trim()};save();toast('Teks struk disimpan')};
A.pinSave=()=>{const v=$('#np').value.trim();if(!/^\d{4,}$/.test(v))return err('PIN minimal 4 angka.');S.cfg.pin=v;save();$('#np').value='';err('');toast('PIN diganti')};
A.exp=el=>{
 const w=el.dataset.w,d=ymd(Date.now());let rows;
 if(w==='tx'){rows=[['ID transaksi','ID shift','Toko','Tanggal','Jam','Metode','Produk','Qty','Harga','Subtotal','Total transaksi','Status','Rincian bayar']];S.txs.forEach(t=>t.items.forEach(i=>rows.push([t.id,t.shiftId,t.store,ymd(t.t),hm(t.t),t.method,i.name,i.qty,i.price,i.qty*i.price,t.total,t.void?'VOID':(t.edited?'DIUBAH':'OK'),(t.pays||[]).map(x=>x.method+' '+x.amount).join(' + ')])))}
 else if(w==='moves'){rows=[['ID','Tanggal','Jam','Produk','Dari','Ke','Qty','Oleh','Catatan','Status']];S.moves.forEach(m=>rows.push([m.id,ymd(m.t),hm(m.t),pname(m.pid),m.from,m.to,m.qty,m.by,m.note,m.status]))}
 else if(w==='shifts'){rows=[['ID shift','Toko','Tanggal','Buka','Tutup','Karyawan hadir','Kas awal','Penjualan tunai','Kas masuk','Kas keluar','Kas seharusnya','Total penjualan','Transaksi']];S.shifts.forEach(s=>rows.push([s.id,s.store,ymd(s.openedAt),hm(s.openedAt),hm(s.closedAt),s.staff.join(' / '),s.cashStart,s.cashSales,s.cashIn||0,s.cashOut||0,s.expected,s.total,s.n]))}
 else{rows=[['ID shift','Tanggal','Toko','Karyawan']];S.attendance.forEach(a=>rows.push([a.shiftId,a.date,a.store,a.name]))}
 download('wismir-'+w+'-'+d+'.csv',csv(rows));
};
A.backup=()=>download('wismir-cadangan-'+ymd(Date.now())+'.json',JSON.stringify(S),'application/json');
A.restore=()=>$('#rst').click();
A.reset=el=>twoTap(el,'Ketuk lagi untuk HAPUS SEMUA data',()=>{S=blank();seed();stLoc=S.cfg.store;ownerOK=false;sel.clear();render();toast('Data direset ke contoh')});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(e.target.id==='bg'){closeSheet();return}
 const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',e=>{
 const el=e.target;if(!el.dataset||!el.dataset.in)return;
 if(el.dataset.in==='money'){const n=num(el.value);el.value=el.value===''?'':dot(n);if(el.id==='pp')updPrice();else if(el.dataset.sp){PAY.sp[el.dataset.sp]=n;updSplit()}else if(el.dataset.ei!==undefined)updEdit();else if(el.id==='cashStart')draft.cash=el.value}
 else if(I[el.dataset.in])I[el.dataset.in](el,e);
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.np!==undefined)NP=e.target});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.np'))e.preventDefault()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.ch&&C[el.dataset.ch])C[el.dataset.ch](el)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#bg').classList.contains('open')){closeSheet();return}
 if(e.key==='Enter'&&e.target.tagName==='INPUT'){const sc=e.target.closest('#sheet')?$('#sheet [data-enter]'):(e.target.id==='pin'?$('[data-a=unlock]'):null);if(sc){e.preventDefault();sc.click()}}
});
$('#rst').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.products)||!Array.isArray(o.moves))throw 0;S=o;S.cfg=S.cfg||{store:'Toko A',pin:'1234'};S.outbox=S.outbox||[];S.since=S.since||0;save();stLoc=S.cfg.store;ownerOK=false;render();toast('Data dipulihkan')}catch(x){toast('File cadangan tidak valid')}e.target.value=''};
 r.readAsText(f);
});
window.addEventListener('resize',placeInd);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderChrome();kick(0)}});
window.addEventListener('online',()=>{tries=0;kick(0)});
setInterval(()=>{if(!document.hidden&&!flushing&&!pulling)kick(0)},60000);

/* ---------- init ---------- */
buildNav();render();
requestAnimationFrame(()=>requestAnimationFrame(()=>{placeInd();$('#side').classList.add('ready');$('#bot').classList.add('ready')}));
kick(800);
window.__wismir={get S(){return S}};
})();
</script>
