<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/dash-192.png">
<link rel="apple-touch-icon" href="icons/dash-192.png">
<title>WISMIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171a;--dark:#16181b;--mute:#6f7780;--line:#e9edef;--green:#2e6b4f;--card:#fff;--bg1:#d9efe9;--bg2:#e6ebf6;--bg3:#f4f6f7}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 0% 0%,var(--bg1),transparent 60%),radial-gradient(800px 500px at 100% 20%,var(--bg2),transparent 60%),var(--bg3)}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box{width:100%;max-width:520px}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:22px}
.lm{width:42px;height:42px;border-radius:13px;background:var(--dark);color:#fff;display:grid;place-items:center}.lm svg{width:21px;height:21px}
.g{display:grid;gap:12px;grid-template-columns:1fr 1fr}
a{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;color:var(--ink);text-decoration:none;transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,60,60,.10)}
.ic{width:46px;height:46px;border-radius:50%;background:#e5efeb;color:var(--green);display:grid;place-items:center}.ic svg{width:22px;height:22px}
b{font-size:17px;letter-spacing:-.01em}
span{font-size:13px;color:var(--mute)}
@media (max-width:420px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="box">
 <div class="logo"><span class="lm"><svg viewBox="0 0 24 24"><path d="M4 16l5-6 4 4 7-8"/></svg></span>wismir</div>
 <div class="g">
  <a href="dashboard.html"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><b>Dashboard</b><span>Owner · pantau bisnis</span></a>
  <a href="pos.html"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/></svg></span><b>POS</b><span>Kasir · stok · absen</span></a>
 </div>
</main>
</body>
</html>
